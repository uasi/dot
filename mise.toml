[tools]
helix = "latest"
jj = "latest"
rg = "latest"

[settings.dotfiles]
root = "~/.config/mise/dotfiles.d"

[dotfiles]
"~/.config/git/config" = {}
"~/.config/helix/config.toml" = {}
"~/.config/jj/config.toml" = {}

[dotfiles."~/.bash_profile/load_profile"]
line = "[[ -f ~/.profile && -z \"${SH_PROFILE_LOADED:-}\" ]] && . ~/.profile"
position = "prepend"

[dotfiles."~/.profile/loaded_marker"]
line = "SH_PROFILE_LOADED=1"
position = "prepend"

[bootstrap.mise_shell_activate]
bash = true
zsh = true

[tasks.bootstrap]
dir = "~/.config/mise"
run = """
: enabling local config from src.d

{% for env in mise_env | default(value=[]) %}
src=src.d/{{ env }}.toml
dst=conf.d/{{ env }}.local.toml
if [ -f "$src" -a ! -f "$dst" ]; then
  ln -s "../$src" "$dst"
  conf_linked=1
fi
{% endfor %}

if [ -n "$conf_linked" ]; then
  echo "info: local config enabled; you may need to re-run bootstrap"
else
  echo "info: nothing changed"
fi
"""
